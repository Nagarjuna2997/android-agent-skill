name: Prepare release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package:test
      - uses: actions/upload-artifact@v7
        with:
          name: npm-release-candidate
          path: '*.tgz'
# Publication is intentionally separate. Review validation and authenticate npm before publishing.
