name: Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_connected_tests:
        description: "Run instrumentation tests on an emulator"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # AGP 9.4.0 runs on JDK 17 (data/versions.json). The project's own Gradle wrapper pins Gradle.
  JAVA_VERSION: "17"
  MODULE: "app"

permissions:
  contents: read
  checks: write

jobs:
  check:
    name: Lint, unit tests, debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Keep the cache read-only on PRs so forks cannot poison it; main writes it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Style check
        run: |
          if [ -x hooks/check-android-style.sh ]; then
            hooks/check-android-style.sh ${{ env.MODULE }}/src/main
          else
            echo "hooks/check-android-style.sh not present, skipping"
          fi

      - name: Lint
        run: ./gradlew :${{ env.MODULE }}:lintDebug --no-daemon --stacktrace

      - name: Unit tests
        run: ./gradlew :${{ env.MODULE }}:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug
        run: ./gradlew :${{ env.MODULE }}:assembleDebug --no-daemon --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: ${{ env.MODULE }}/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            ${{ env.MODULE }}/build/reports/tests/testDebugUnitTest/
            ${{ env.MODULE }}/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.MODULE }}/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Optional: instrumentation tests on an emulator. Slow (10 to 20 minutes) and flaky under
  # load, so it runs only on manual dispatch with the input set, or on pushes to main.
  # Remove the `if` to run it on every PR once the suite is stable.
  connected:
    name: Connected tests (optional)
    needs: check
    if: ${{ github.event.inputs.run_connected_tests == 'true' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 36]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :${{ env.MODULE }}:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-test-reports-api${{ matrix.api-level }}
          path: |
            ${{ env.MODULE }}/build/reports/androidTests/connected/
            ${{ env.MODULE }}/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
