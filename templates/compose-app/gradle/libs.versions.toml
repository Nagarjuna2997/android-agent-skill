# Version catalog for the Compose app template.
# Versions marked "versions.json" come from this repository's data/versions.json (verified 2026-09-29).
# Versions written as <version> are not tracked there: resolve each from the linked release page
# before the first build, and never guess.

[versions]
# Toolchain (versions.json)
agp = "9.4.0"
kotlin = "2.4.20"
compileSdk = "37"
targetSdk = "36"
minSdk = "26"

# Not in versions.json: must match the Kotlin version prefix, e.g. 2.4.20-1.0.x.
# https://github.com/google/ksp/releases
ksp = "<version>"
# Dagger Hilt plugin and runtime. https://github.com/google/dagger/releases
hilt = "<version>"
# kotlinx.serialization runtime. https://github.com/Kotlin/kotlinx.serialization/releases
kotlinxSerialization = "<version>"
# kotlinx.coroutines (runtime and test). https://github.com/Kotlin/kotlinx.coroutines/releases
kotlinxCoroutines = "<version>"
# Turbine Flow testing. https://github.com/cashapp/turbine/releases
turbine = "<version>"
# JUnit 4. https://github.com/junit-team/junit4/releases
junit = "<version>"
# AndroidX core-ktx, activity, test. https://developer.android.com/jetpack/androidx/versions
coreKtx = "<version>"
activity = "<version>"
coreSplashscreen = "<version>"
androidxTestExt = "<version>"
androidxTestRunner = "<version>"
espresso = "<version>"

# AndroidX (versions.json)
composeBom = "2026.09.00"
material3 = "1.4.0"
lifecycle = "2.11.0"
navigation = "2.10.2"
androidxHilt = "1.4.0"
room = "2.8.5"
datastore = "1.2.1"
workmanager = "2.12.0"
window = "1.5.1"

[libraries]
# Compose, versions from the BOM
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Activity, lifecycle, navigation
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-window = { group = "androidx.window", name = "window", version.ref = "window" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidxHilt" }

# Data (not used by the template's code; aliases ready for the first feature that needs them)
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workmanager" }

# Kotlin
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExt" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
